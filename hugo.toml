baseURL = "https://blog.crazyai.uk/"
languageCode = "en"
defaultContentLanguage = "en"
title = "Zero to One AI"
theme = "PaperMod"
[pagination]
  pagerSize = 10

# 启用 Emoji
enableEmoji = true
# 启用 robots.txt
enableRobotsTXT = true
# 启用 Git 信息
enableGitInfo = true

[params]
  env = "production"
  title = "Zero to One AI"
  description = "An honest public learning log about understanding and building AI from first principles."
  keywords = ["AI learning", "machine learning", "deep learning", "transformers", "LLM", "experiments"]
  author = "JOJO"
  defaultTheme = "light"
  ShowShareButtons = false
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = false

  [params.homeInfoParams]
    Title = "Zero to One AI"
    Content = "Learning AI from first principles, one honest experiment at a time."

  [params.label]
    text = "zero → one"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/xstressr"

  [params.editPost]
    URL = ""
    Text = "Edit"
    appendFilePath = true

  [params.assets]
    favicon = "/favicon.ico"
    disableFingerprinting = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "tango"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "Notes"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "roadmap"
    name = "Roadmap"
    url = "/roadmap/"
    weight = 20
  [[menu.main]]
    identifier = "about"
    name = "About"
    url = "/about/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "Search"
    url = "/search/"
    weight = 40
