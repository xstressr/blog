baseURL = "https://blog.crazyai.uk/"
languageCode = "en"
defaultContentLanguage = "en"
title = "JOJO's Blog"
theme = "PaperMod"
[pagination]
  pagerSize = 10

# 启用 Emoji
enableEmoji = true
# 启用 robots.txt
enableRobotsTXT = true
# 启用 Git 信息
enableGitInfo = true

[params]
  env = "production"
  title = "JOJO's Blog"
  description = "Tech, AI, and random thoughts"
  keywords = ["blog", "tech", "AI", "coding"]
  author = "JOJO"
  defaultTheme = "auto"        # 自动跟随系统深色模式
  ShowShareButtons = true
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowWordCount = true
  ShowRssButtonInSectionTermList = true
  UseHugoToc = true
  disableSpecial1stPost = false
  hidemeta = false
  hideSummary = false
  showtoc = true
  tocopen = true

  [params.homeInfoParams]
    Title = "👋 Welcome to JOJO's Blog"
    Content = "Exploring tech, AI experiments, and random thoughts"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/xstressr"

  [params.editPost]
    URL = ""
    Text = "Edit"
    appendFilePath = true

  [params.assets]
    favicon = "/favicon.ico"
    disableFingerprinting = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    codeFences = true
    guessSyntax = true
    lineNos = false
    style = "monokai"

[menu]
  [[menu.main]]
    identifier = "posts"
    name = "📝 Posts"
    url = "/posts/"
    weight = 10
  [[menu.main]]
    identifier = "tags"
    name = "🏷️ Tags"
    url = "/tags/"
    weight = 20
  [[menu.main]]
    identifier = "archives"
    name = "📚 Archives"
    url = "/archives/"
    weight = 30
  [[menu.main]]
    identifier = "search"
    name = "🔍 Search"
    url = "/search/"
    weight = 40
  [[menu.main]]
    identifier = "about"
    name = "👤 About"
    url = "/about/"
    weight = 50
